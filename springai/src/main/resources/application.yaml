spring:
  ai:
    openai:
      base-url: https://g7e6ai.com
      api-key: ${DEEPSEEK_API_KEY:sk-e00e29b97461b8ca221026600d993fca4b7850d8f6e5ff38d016d788f1265b38}
      chat:
        model: ${DEEPSEEK_MODEL:gpt-5.6-sol}
    deepseek:
      api-key: sk-cd973eb09fd44073b80b25c69765a397
      chat:
        model: deepseek-chat
    # 第五课：工具调用配置（作用于所有使用自动配置 ToolCallingAdvisor 的 ChatClient）
    tools:
      # false（默认）：工具抛异常时，把异常信息发回给模型；true：直接抛给调用方
      throw-exception-on-error: false
      limits:
        # 单个工具在一轮对话里最多被调用几次，key 是工具名（方法名，区分大小写）
        max-calls-per-tool:
          getShipmentTrace: 2
  servlet:
    encoding:
      charset: UTF-8
      force-response: true

logging:
  level:
    org:
      springframework:
        ai:
          chat:
            client:
              advisor: DEBUG
